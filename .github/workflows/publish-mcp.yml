name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry so the listing for
# io.github.rbmuller/scherlok tracks every release. Runs after the Release
# workflow succeeds (PyPI must already have the version, because the registry
# validates the PyPI package and its `mcp-name` README marker), and can be
# dispatched manually to (re)publish the version currently in server.json.
#
# Authentication is GitHub OIDC: no long-lived token, and the registry grants
# the io.github.rbmuller/* namespace to workflows running in this owner's repos.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC login to the registry
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, head_branch holds the tag that triggered Release.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Check server.json version matches the release tag
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(jq -r '.version' server.json)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "server.json version ($ACTUAL) does not match tag ($TAG)"; exit 1
          fi

      - name: Wait for the version to be visible on PyPI
        run: |
          VERSION="$(jq -r '.version' server.json)"
          for attempt in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/scherlok/${VERSION}/json" >/dev/null; then
              echo "scherlok ${VERSION} is on PyPI"; exit 0
            fi
            echo "attempt ${attempt}: not yet on PyPI, retrying in 30s"; sleep 30
          done
          echo "scherlok ${VERSION} never appeared on PyPI"; exit 1

      - name: Install mcp-publisher
        run: |
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_${ARCH}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
