name: Docs

# Builds the MkDocs site and publishes it to GitHub Pages
# (https://rbmuller.github.io/scherlok/) whenever documentation sources change
# on main. Pull requests get a strict build check from ci.yml instead.

on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - website/**
      - src/scherlok/**/README.md
      - src/scherlok/connectors/bigquery.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
