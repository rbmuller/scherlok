[project]
name = "scherlok-mcpb"
version = "1.0.3"
description = "Claude Desktop bundle for the Scherlok MCP server"
requires-python = ">=3.10"
dependencies = [
    # A floor, not an exact pin: the bundle is packed during the release that
    # publishes this very version, so a lockfile or a `==` pin could only ever
    # resolve against the *previous* release. The floor is raised on every
    # release and tests/test_mcpb.py keeps it equal to the package version, so
    # an installed extension gets this release or a later 1.x fix.
    "scherlok[duckdb,mysql]>=1.0.3,<2",
    # cryptography reaches here through mcp -> pyjwt[crypto]. From 49.0.0 it
    # publishes macOS wheels for arm64 only, so an Intel Mac would fall back to
    # a Rust build and a one-click install would fail on a machine without a
    # toolchain. 48.x still ships universal2 wheels.
    "cryptography<50",
]

[tool.uv]
# Scripts only — there is nothing here to build or install as a package.
package = false
